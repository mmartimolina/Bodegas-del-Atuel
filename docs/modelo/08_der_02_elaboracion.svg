<text x="30" y="34" font-size="17" font-weight="bold">A-08 · DER (2/6) — Elaboración de vinos</text>
<text x="30" y="56" font-size="9.5" fill="#333333">Notación: K = clave candidata respaldada [R] · I = inferida · P = pendiente de validación · AK = alterna · K/FK = componente de clave y foránea · FK → subrogada de cabecera/roja (débil: clave propietaria + parcial). Colores: azul = fuerte · verde (borde discontinuo) = débil · naranja = asociativa · amarillo = inventario · violeta = supertipo · violeta claro = subtipo. Cardinalidad &quot;A x..y — z..w B&quot; por extremo (A-04); * = extremo inferido. Cajas grises = referencia repetida de otra página.</text>
<text x="30" y="70" font-size="9.5" fill="#333333">Cardinalidades: rangos independientes por extremo (A-04: A x..y — z..w B); * junto al extremo inferido/condicionado; mínimo 0 = participación parcial.</text>
